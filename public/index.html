<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO V2 | Premium Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div id="app-bg"></div>
    <div id="overlay-mesh"></div>
    <div id="vfx-layer"></div>
    <div id="mouse-glow"></div>

    <div id="game-container" class="main-panel">

        <!-- START SCREEN -->
        <div id="screen-start" class="screen-wrapper">
            <header class="panel-header">
                <div class="logo-badge">UNO</div>
                <h1 class="premium-title">UNO V2</h1>
                <p class="title-sub">The Premium Multiplayer Experience</p>
            </header>

            <div class="panel-content">
                <div class="input-group">
                    <input type="text" id="username" class="premium-input" placeholder="Enter Nickname" maxlength="15">
                </div>

                <div class="btn-container">
                    <button id="btn-bot" class="btn-premium btn-primary">
                        <span>🎮</span> PLAY VS AI BOT
                    </button>
                    <button id="btn-create" class="btn-premium">
                        <span>🏠</span> CREATE ROOM
                    </button>
                    <button id="btn-join" class="btn-premium">
                        <span>🔗</span> JOIN ROOM
                    </button>
                </div>

                <div id="join-controls" class="hidden">
                    <input type="text" id="room-code" class="premium-input" placeholder="6-DIGIT CODE">
                    <button id="btn-confirm-join" class="btn-premium btn-primary">JOIN PARTY</button>
                </div>
            </div>
        </div>

        <!-- LOBBY SCREEN -->
        <div id="screen-lobby" class="screen-wrapper hidden">
            <header class="panel-header">
                <p class="title-sub">ROOM CODE</p>
                <h2 id="display-room-code" class="room-code-display">------</h2>
            </header>

            <div class="panel-content">
                <div id="player-list" class="player-grid">
                    <!-- Players go here -->
                </div>

                <button id="btn-start" class="btn-premium btn-primary hidden">START GAME</button>
                <p id="waiting-msg" class="waiting-text">WAITING FOR HOST TO START...</p>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="screen-game" class="screen-wrapper hidden">
            <header id="opponents" class="opponents-bar">
                <!-- Opponents -->
            </header>

            <main id="board">
                <div id="draw-pile" class="card draw-card">
                    <div class="draw-card-label">UNO</div>
                    <div class="draw-card-sub">DRAW</div>
                </div>

                <div id="discard-pile">
                    <!-- Top card -->
                </div>

                <div class="game-meta-box">
                    <p class="meta-label">CURRENT TURN</p>
                    <h3 id="current-turn" class="meta-value">-</h3>
                    <div id="color-swatch" class="color-indicator"></div>
                </div>
            </main>

            <footer class="hand-footer">
                <div id="my-hand">
                    <!-- Cards -->
                </div>
                <div class="hand-actions">
                    <button id="btn-uno" class="btn-uno hidden">UNO!</button>
                </div>
            </footer>
        </div>

        <!-- VICTORY SCREEN -->
        <div id="screen-victory" class="screen-wrapper hidden">
            <div class="victory-content">
                <div class="trophy-icon">🏆</div>
                <p class="title-sub">WINNER</p>
                <h1 id="winner-name" class="premium-title">CONGRATS!</h1>
                <button id="btn-rematch" class="btn-premium btn-primary">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <!-- UI Overlay elements (OUTSIDE game-container) -->
    <div id="toast-container"></div>

    <!-- Color Picker Overlay -->
    <div id="color-picker" class="overlay-modal hidden">
        <div class="overlay-modal-inner">
            <h3 class="overlay-modal-title">CHOOSE A COLOR</h3>
            <div class="color-btn-grid">
                <button class="color-btn color-btn-red" data-color="red"></button>
                <button class="color-btn color-btn-blue" data-color="blue"></button>
                <button class="color-btn color-btn-green" data-color="green"></button>
                <button class="color-btn color-btn-yellow" data-color="yellow"></button>
            </div>
        </div>
    </div>

    <!-- Target Picker Overlay -->
    <div id="target-picker" class="overlay-modal hidden">
        <div class="overlay-modal-inner">
            <h3 class="overlay-modal-title">SELECT TARGET</h3>
            <div id="target-list" class="target-btn-list"></div>
        </div>
    </div>

    <!-- Powerup Cinematic Overlay -->
    <div id="powerup-overlay" class="overlay-cinematic hidden">
        <div class="cinematic-content">
            <p id="pu-user" class="title-sub"></p>
            <h1 id="pu-name" class="premium-title">POWERUP</h1>
            <p id="pu-desc" class="cinematic-desc"></p>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
